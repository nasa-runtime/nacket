application:
  name: "nacket"
  mode: "service"
  startup_timeout_ms: 45000
  shutdown_timeout_ms: 15000
log:
  level: "${NACKET_LOG_LEVEL:info}"
  path: "${NACKET_LOG_PATH:/usr/local/logs/${application.name}}"
  color: false
server:
  enabled: true
  host: "0.0.0.0"
  port: 3031
  health: true
  request_body_limit_bytes: 262144
  max_inflight_requests: 32
  request_deadline_ms: 2000
ws:
  enabled: true
  addr: "0.0.0.0:3030"
  multiplex: true
  auth_timeout_ms: 5000
  heartbeat_timeout_ms: 60000
config_watch:
  enabled: true
redis:
  enabled: false
kafka:
  enabled: false
nacos:
  enabled: false
discovery:
  enabled: true
  connections:
    primary:
      provider: "nacos"
      startup_required: true
      request_timeout_ms: 1000
      poll_interval_ms: 1000
      snapshot:
        max_age_ms: 10000
        stale_if_error_ms: 0
      nacos:
        server_addr: "${NACKET_NACOS_HTTP:http://nacos:8848/}"
        namespace: "public"
        group: "NACKET"
        username: "${NACKET_NACOS_USER}"
        password: "${NACKET_NACOS_PASSWORD}"
        services:
          self:
            name: "nacket"
          business:
            name: "service-a"
      rest:
        request_timeout_ms: 2000
        connect_timeout_ms: 500
        lb_strategy: "round_robin"
  registrations: {}
grafana:
  observability:
    enabled: false
nacket:
  nodeId: "node-a"
  clusterId: "cluster-a"
  scopeEpoch: "1"
  routeLedger: "data/routes.json"
  readiness:
    policy: "runtime"
  routes:
    -
      routeId: "route-a"
      revision: 1
      enabled: true
      serialization: "JSON_BYTES"
      access:
        listenerRef: "shared"
        endpoint: "/route-a"
        native:
          enabled: true
      identity:
        mode: "remote_http"
        endpointRef: "business"
      originCheck:
        allowMissing: false
        allowedOrigins:
          - "https://app.example.com"
      servicePush:
        enabled: false
      subscriptions:
        enabled: true
        authorization:
          mode: "remote_http"
          endpointRef: "business"
      receiving:
        direct:
          enabled: false
      schemas:
        schema-a:
          schemaId: "schema-a"
          fields:
            -
              tag: 1
              name: "value"
              type:
                kind: "string"
              maxBytes: 65536
      events:
        event-a:
          schema: "schema-a"
          maxBytes: 65536
  endpoints:
    business:
      target:
        mode: "discovery"
        connection: "primary"
        service: "business"
        path: "/socket/authorize"
      timeoutMs: 2000
      maxResponseBytes: 32768
      maxIdentityTtlMs: 300000
      call:
        method: "POST"
        serviceTokenSecretRef: "NACKET_BUSINESS_TOKEN"
        maxInFlight: 32
rest_clients:
  business:
    enabled: true
    provider: "external"
    timeout_ms: 3000
